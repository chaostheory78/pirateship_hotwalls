<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Black Pearl – Solent AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      #overlay {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 999;
        pointer-events: none;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="overlay">Point at the channel marker ⚓</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="ship" src="./black_pearl.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- This entity appears when the channel marker is detected -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- The Black Pearl, scaled and positioned to sit on the marker -->
        <a-gltf-model
          src="#ship"
          position="0 0.2 0"
          rotation="-90 180 0"
          scale="0.003 0.003 0.003"
          animation="property: rotation; to: -90 540 0; dur: 20000; loop: true; easing: linear"
        ></a-gltf-model>

        <!-- Optional: soft glow beneath the ship -->
        <a-circle
          position="0 0 0"
          rotation="-90 0 0"
          radius="0.3"
          color="#001133"
          opacity="0.4"
        ></a-circle>

      </a-entity>
    </a-scene>

    <script>
      // Hide the instruction overlay once the target is found
      const scene = document.querySelector('a-scene');
      scene.addEventListener('targetFound', () => {
        document.getElementById('overlay').style.display = 'none';
      });
      scene.addEventListener('targetLost', () => {
        document.getElementById('overlay').style.display = 'block';
      });
    </script>
  </body>
</html>
