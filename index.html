<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Black Pearl – Solent AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>window.THREE = AFRAME.THREE;</script>
    <script src="https://www.gstatic.com/draco/versioned/decoders/1.5.6/draco_decoder.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        background: #000;
      }
      #splash img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #splash img.loaded { opacity: 1; }
      #splash::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 55%;
        background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%);
        z-index: 1;
        pointer-events: none;
      }
      #splash-content {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 0 24px 52px;
      }
      #splash-title {
        font-family: Georgia, serif;
        font-size: 30px;
        color: #fff;
        letter-spacing: 5px;
        text-transform: uppercase;
        text-shadow: 0 2px 24px rgba(0,0,0,0.95);
        margin-bottom: 6px;
      }
      #splash-sub {
        font-family: sans-serif;
        font-size: 12px;
        color: rgba(255,255,255,0.65);
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 36px;
      }
      #start-btn {
        background: rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.45);
        color: #fff;
        font-family: sans-serif;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 15px 40px;
        border-radius: 30px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: background 0.2s;
      }
      #start-btn:active { background: rgba(255,255,255,0.15); }

      #overlay {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 999;
        pointer-events: none;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>

    <div id="splash">
      <img id="splash-img" src="./black_pearl_preview.jpg" alt="Black Pearl on the Solent" />
      <div id="splash-content">
        <div id="splash-title">The Black Pearl</div>
        <div id="splash-sub">Solent AR Experience</div>
        <button id="start-btn">⚓ Launch AR</button>
      </div>
    </div>

    <div id="overlay">Point at the channel marker ⚓</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="ship" src="./black_pearl.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          src="#ship"
          position="0 0.2 0"
          rotation="-90 180 0"
          scale="0.003 0.003 0.003"
          animation="property: rotation; to: -90 540 0; dur: 20000; loop: true; easing: linear"
        ></a-gltf-model>
        <a-circle position="0 0 0" rotation="-90 0 0" radius="0.3" color="#001133" opacity="0.4"></a-circle>
      </a-entity>
    </a-scene>

    <script>
      const splashImg = document.getElementById('splash-img');
      splashImg.addEventListener('load', () => splashImg.classList.add('loaded'));
      if (splashImg.complete) splashImg.classList.add('loaded');

      document.getElementById('start-btn').addEventListener('click', () => {
        const splash = document.getElementById('splash');
        splash.style.transition = 'opacity 0.6s ease';
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
          document.getElementById('overlay').style.display = 'block';
          const scene = document.querySelector('a-scene');
          const arSystem = scene.systems['mindar-image-system'];
          if (arSystem) arSystem.start();
        }, 600);
      });

      const scene = document.querySelector('a-scene');
      scene.addEventListener('targetFound', () => {
        document.getElementById('overlay').style.display = 'none';
      });
      scene.addEventListener('targetLost', () => {
        document.getElementById('overlay').style.display = 'block';
      });
    </script>
  </body>
</html>
